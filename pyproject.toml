[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-index-mcp"
version = "0.1.0"
description = "Persistent fine-grained Python and Markdown code intelligence MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Code Index MCP" }
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
watch = [
    "watchfiles>=1.0.0,<2.0.0",
]
semantic = [
    "numpy>=1.26,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pytest-mock>=3.15,<4.0"
]

[project.scripts]
code-index-mcp = "code_index_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_index_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
