[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "code-index-mcp"
version = "0.1.0"
description = "Persistent fine-grained Python and Markdown code intelligence MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Arthure Antony" }
]
dependencies = [
    "mcp>=2.1.1",
]

[project.optional-dependencies]
watch = [
    "watchfiles>=1.2.0",
]
semantic = [
    "numpy>=2.5.2",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pytest-mock>=3.15.1"
]

[project.scripts]
code-index-mcp = "code_index_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_index_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
